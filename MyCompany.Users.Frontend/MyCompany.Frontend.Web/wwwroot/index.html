<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCompany Platform</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MyCompany.Frontend.Web.styles.css" rel="stylesheet" />
</head>
<body>

    <div id="app">
        <div class="container text-center mt-5">
            <div class="spinner-border text-primary" role="status"></div>
            <h4 class="mt-3 text-secondary">Initialisation du moteur .NET WebAssembly...</h4>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        Une erreur est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        console.log("=== [DIAGNOSTIC] Démarrage manuel de Blazor... ===");

        Blazor.start({
            logLevel: 0, // 0 = Mode TRACE (Le plus verbeux possible)
            environment: "Development"
        })
            .then(() => console.log("=== [DIAGNOSTIC] Blazor a démarré avec succès ! ==="))
            .catch(error => {
                console.error("=== 🛑 CRASH FATAL AU BOOTSTRAP BLAZOR ===");
                console.error(error);
                alert("Erreur de chargement Blazor : " + error.message);
            });
    </script>
</body>
</html>
